<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset=".55" stop-color="#111116"/>
      <stop offset="1" stop-color="#1d1728"/>
    </linearGradient>
    <linearGradient id="question" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddd5ff"/>
      <stop offset="1" stop-color="#8b78ff"/>
    </linearGradient>
    <pattern id="question-pattern" width="154" height="126" patternUnits="userSpaceOnUse">
      <text x="15" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#c4b8ff" fill-opacity=".09">?</text>
      <text x="92" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" fill-opacity=".055">?</text>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#background)"/>
  <rect width="1200" height="300" rx="20" fill="url(#question-pattern)"/>
  <circle cx="160" cy="150" r="76" fill="#8b78ff" fill-opacity=".1"/>
  <circle cx="160" cy="150" r="66" fill="none" stroke="url(#question)" stroke-opacity=".75" stroke-width="5"/>
  <text x="160" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="700" fill="url(#question)">?</text>
  <text x="290" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" fill="#fff">Coming Soon</text>
  <text x="292" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#c4c0ce">Something new is on the way</text>
</svg>
