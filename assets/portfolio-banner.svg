<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Achxearon Portfolio</title>
  <desc id="desc">A dark developer portfolio banner with a code-style portfolio title and window preview.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="0.58" stop-color="#17171d"/>
      <stop offset="1" stop-color="#2b1938"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b8ff"/>
      <stop offset="1" stop-color="#8b78ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#background)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <circle cx="1035" cy="35" r="150" fill="#8b78ff" opacity=".11" filter="url(#glow)"/>

  <g transform="translate(68 76)">
    <rect width="48" height="48" rx="24" fill="#08080a" stroke="#fff" stroke-opacity=".16"/>
    <circle cx="24" cy="24" r="5" fill="url(#accent)"/>
  </g>

  <text x="138" y="126" fill="#a7a7af" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="26" font-weight="500">Hello, I'm</text>
  <text x="138" y="190" fill="#fff" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-3">&lt;/achxearon&gt;</text>

  <g transform="translate(802 58)">
    <rect width="320" height="184" rx="14" fill="#09090c" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    <rect x="1" y="1" width="318" height="36" rx="13" fill="#17171d"/>
    <path d="M1 36h318" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="22" cy="19" r="5" fill="#ff6b6b"/>
    <circle cx="39" cy="19" r="5" fill="#ffd166"/>
    <circle cx="56" cy="19" r="5" fill="#8b78ff"/>

    <rect x="20" y="56" width="72" height="108" rx="8" fill="#111116" stroke="#fff" stroke-opacity=".08"/>
    <rect x="36" y="72" width="40" height="5" rx="2.5" fill="#8b78ff"/>
    <rect x="36" y="90" width="28" height="5" rx="2.5" fill="#fff" fill-opacity=".18"/>
    <rect x="36" y="108" width="34" height="5" rx="2.5" fill="#fff" fill-opacity=".12"/>
    <rect x="36" y="126" width="22" height="5" rx="2.5" fill="#fff" fill-opacity=".12"/>

    <rect x="108" y="56" width="192" height="108" rx="8" fill="#111116" stroke="#fff" stroke-opacity=".08"/>
    <rect x="128" y="76" width="92" height="8" rx="4" fill="#fff" fill-opacity=".78"/>
    <rect x="128" y="96" width="150" height="5" rx="2.5" fill="#fff" fill-opacity=".16"/>
    <rect x="128" y="110" width="132" height="5" rx="2.5" fill="#fff" fill-opacity=".12"/>
    <rect x="128" y="140" width="54" height="12" rx="6" fill="url(#accent)" opacity=".9"/>
  </g>
</svg>
